
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÔXE-MAKER-2026 | Bora Buildar!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Londrina+Solid:wght@300;400;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
              logo: ['Londrina Solid', 'cursive'],
            },
            colors: {
              oxe: {
                dark: '#2d1403',
                orange: '#d15e14',
                green: '#637c2d',
                blue: '#00a6ce',
                yellow: '#eeb020',
                red: '#a6341f',
                sand: '#fef3c7',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #2d1403;
        color: #ffffff;
        background-image: 
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      
      .maker-card {
        background: #3d1a04;
        border: 2px solid #d15e14;
        box-shadow: 4px 4px 0px #00a6ce;
      }

      .maker-button {
        box-shadow: 0px 4px 0px #a6341f;
        transition: all 0.1s;
      }
      .maker-button:active {
        transform: translateY(2px);
        box-shadow: 0px 2px 0px #a6341f;
      }

      @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-rotate { animation: rotate-slow 20s linear infinite; }
      
      .tape {
        background: #d15e14;
        transform: rotate(-2deg);
        padding: 2px 10px;
        font-family: 'Space Mono', monospace;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="selection:bg-oxe-blue selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
